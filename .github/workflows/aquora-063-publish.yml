name: Publish accepted AQUORA 0.6.3
on:
  push:
    branches: [aquora-0.6.3-development]
    paths: ['validation/publish-063.txt']
permissions:
  contents: write
  actions: read
concurrency:
  group: aquora-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check immutable accepted source and successful gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42022969585 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42022969585 --jq .head_sha)" = 0f2716ba0499def94884860248f9b0e887b0fd0d
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42022969585
          path: ${{ runner.temp }}/accepted
      - name: Verify accepted artifact hashes and source record
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/accepted"
          for folder in aquora-063-native aquora-063-native-repro aquora-063-browser-wasm aquora-063-single-core aquora-063-release-ready; do
            (cd "$folder" && sha256sum --check --strict SHA256SUMS.txt)
          done
          cmp aquora-063-native/sound-healing-0.6.3.fwsc aquora-063-native-repro/sound-healing-0.6.3.fwsc
          test "$(cat aquora-063-release-ready/validation-commit.txt)" = 0f2716ba0499def94884860248f9b0e887b0fd0d
      - name: Preserve checksummed independent download and publish accepted tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/final"
          mkdir "$out"
          accepted="$RUNNER_TEMP/accepted"
          cp "$accepted/aquora-063-release-ready/"* "$out/"
          cp "$accepted/aquora-063-native/sound-healing-0.6.3.fwsc" "$out/"
          cp "$accepted/aquora-063-single-core/sound-healing-0.6.3.fwsc" "$out/sound-healing-0.6.3-single-core.fwsc"
          cp release/0.6.3/RELEASE.md "$out/"
          (cd "$accepted" && zip -qr "$out/AQUORA-0.6.3-acceptance.zip" .)
          (cd "$out" && zip -q AQUORA-0.6.3-download.zip AQUORA-0.6.3-source.tar.gz AQUORA-0.6.3-package.tar.gz sound-healing-0.6.3.fwsc sound-healing-0.6.3-single-core.fwsc validation-commit.txt RELEASE.md)
          (cd "$out" && sha256sum *.gz *.zip *.fwsc > SHA256SUMS.txt && sha256sum --check --strict SHA256SUMS.txt)
          if gh release view v0.6.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing v0.6.3 release preserved; inspect before any replacement.'
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/aquora-0.6.3-development" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo 'Newer integration checkpoint exists; stale publisher stopped.'; exit 1; }
          gh release create v0.6.3 --repo "$GITHUB_REPOSITORY" --target "0f2716ba0499def94884860248f9b0e887b0fd0d" \
            --title 'AQUORA 0.6.3 — Generative Sound Sanctuary' \
            --notes-file release/0.6.3/RELEASE.md "$out/"*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquora-063-published-backup
          path: ${{ runner.temp }}/final/
          if-no-files-found: ignore
          retention-days: 30
