name: AQUORA 0.6.5 isolated host validation

on:
  push:
    branches: [aquora-0.6.5-development, aquora-0.6.5-release-integration]
    paths: ['validation/trigger-065.txt']
  workflow_dispatch:
  pull_request:
    branches: [aquora-0.6.5-development, aquora-0.6.5-release-integration]

permissions:
  contents: read
  actions: read

concurrency:
  group: aquora-0.6.5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regressions:
    name: Verify archives and sanitized host DSP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify versioned recovery archives
        run: |
          cd evidence/0.6.0/editor
          sha256sum --check SHA256SUMS.txt
      - name: Reuse unchanged five successful DSP gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 8aa8338c4304c3d0748680c0f7f879b4b7735af9
          git diff --exit-code 8aa8338c4304c3d0748680c0f7f879b4b7735af9 HEAD -- device/dsp tests/patch_shape_060.c tests/groove_air_060.c tests/motif_memory_060.c tests/play_grid_060.c tests/arrangement_roles_060.c
          gh api --allow-escape-sequences repos/$GITHUB_REPOSITORY/actions/jobs/127590393672/logs > /tmp/previous-dsp.log
          for name in patch_shape_060 groove_air_060 motif_memory_060 play_grid_060 arrangement_roles_060; do grep -F "PASS $name" /tmp/previous-dsp.log; done
      - name: Reuse unchanged three successful corrected DSP gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin 50eb07a6c807980c4e709d5e29c13f2434380dfa
          git diff --exit-code 50eb07a6c807980c4e709d5e29c13f2434380dfa HEAD -- device/dsp tests/next_acceptance.c tests/dsp_acceptance.c tests/stereo.c
          mkdir -p /tmp/aquora-0.6.5-host-tests
          gh api --allow-escape-sequences repos/$GITHUB_REPOSITORY/actions/jobs/127592616019/logs > /tmp/aquora-0.6.5-host-tests/inherited-dsp.log
          for name in next_acceptance dsp_acceptance stereo; do grep -F "PASS $name" /tmp/aquora-0.6.5-host-tests/inherited-dsp.log; done
          cp /tmp/previous-dsp.log /tmp/aquora-0.6.5-host-tests/inherited-first-five.log
      - name: Preserve successful unchanged transport test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin 83fa23433112df3fdb4da9248286a4f41e4bb852
          git diff --exit-code 83fa23433112df3fdb4da9248286a4f41e4bb852 HEAD -- device/dsp tests/transport_hit.c
          gh api --allow-escape-sequences repos/$GITHUB_REPOSITORY/actions/jobs/127596418193/logs > /tmp/aquora-0.6.5-host-tests/inherited-transport.log
          grep -F 'PASS transport_hit' /tmp/aquora-0.6.5-host-tests/inherited-transport.log
      - name: Build and execute isolated DSP regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aquora-0.6.5-host-tests
          for test in corrective_061 air_status_062 binaural_062 binaural_stereo_062 air_mapping_062 music_modes_064 music_load_064 bass_library_065; do
            gcc -Wall -Wextra -Werror -O1 -g -DSR_DEVICE -DPLAT_HOST \
              -Idevice/dsp -Ivendor/fm1-base/include \
              -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie \
              $(if [[ "$test" != binaural_062 ]]; then echo device/dsp/engine.c; fi) "tests/${test}.c" -lm \
              -o "/tmp/aquora-0.6.5-host-tests/${test}"
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
              "/tmp/aquora-0.6.5-host-tests/${test}" \
              > "/tmp/aquora-0.6.5-host-tests/${test}.log" 2>&1 || {
                cat "/tmp/aquora-0.6.5-host-tests/${test}.log"
                exit 1
              }
            echo "PASS ${test}"
          done
      - name: Verify archived serializer migration and four bank roundtrips
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/migration-base"
          mkdir -p "$base"
          tar -xzf evidence/0.6.0/editor/AQUORA-0.6.0-editor-source.tar.gz -C "$base"
          gcc -Wall -Wextra -Werror -Wno-unused-function -O1 -DSR_DEVICE -DPLAT_HOST -DLEGACY_FIXTURE \
            -DAQ_ARRANGEMENT="\"$base/device/arrangement.c\"" \
            -I"$base/device/dsp" -I"$base/vendor/fm1-base/include" \
            "$base/device/dsp/engine.c" tests/bank_migration_040.c -lm -o "$RUNNER_TEMP/bank-writer"
          "$RUNNER_TEMP/bank-writer" "$RUNNER_TEMP/bank.bin"
          gcc -Wall -Wextra -Werror -O1 -g -DSR_DEVICE -DPLAT_HOST \
            '-DAQ_ARRANGEMENT="../device/arrangement.c"' -Idevice/dsp -Ivendor/fm1-base/include \
            -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie \
            device/dsp/engine.c tests/bank_migration_040.c -lm -o "$RUNNER_TEMP/bank-reader"
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/bank-reader" "$RUNNER_TEMP/bank.bin" | tee /tmp/aquora-0.6.5-host-tests/bank-migration.log
      - name: Verify PCM parity and collect controlled DSP A/B
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 50b8a1e02e215aff1e0a7b738d40f63769d4f502
          mkdir -p /tmp/baseline064
          git show 50b8a1e02e215aff1e0a7b738d40f63769d4f502:device/dsp/serenity.h > /tmp/baseline064/serenity.h
          git show 50b8a1e02e215aff1e0a7b738d40f63769d4f502:device/dsp/engine.c > /tmp/baseline064/engine.c
          gcc -O2 -DSR_DEVICE -DPLAT_HOST -Idevice/dsp -Ivendor/fm1-base/include -c /tmp/baseline064/engine.c -o /tmp/old.o
          python3 - <<'PYOBJ'
          import subprocess
          names=[l.split()[-1] for l in subprocess.check_output(['nm','-g','--defined-only','/tmp/old.o'],text=True).splitlines() if l.split()[-1].startswith('sr_')]
          subprocess.check_call(['objcopy']+[a for n in names for a in ('--redefine-sym',n+'=old_'+n)]+['/tmp/old.o'])
          PYOBJ
          gcc -O2 -DSR_DEVICE -DPLAT_HOST -Idevice/dsp -Ivendor/fm1-base/include device/dsp/engine.c tests/audio_parity_065.c /tmp/old.o -lm -o /tmp/parity
          /tmp/parity | tee /tmp/aquora-0.6.5-host-tests/audio-parity.log
          gcc -O2 -DSR_DEVICE -DPLAT_HOST -Idevice/dsp -Ivendor/fm1-base/include /tmp/baseline064/engine.c tests/benchmark_065.c -lm -o /tmp/bench064
          gcc -O2 -DSR_DEVICE -DPLAT_HOST -Idevice/dsp -Ivendor/fm1-base/include device/dsp/engine.c tests/benchmark_065.c -lm -o /tmp/bench065
          for pass in 1 2 3; do
            /tmp/bench064 > /tmp/aquora-0.6.5-host-tests/before-$pass.log
            /tmp/bench065 > /tmp/aquora-0.6.5-host-tests/after-$pass.log
          done
      - name: Upload compact test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquora-065-host-logs
          path: /tmp/aquora-0.6.5-host-tests/*.log
          if-no-files-found: ignore
          retention-days: 30

  platform-acceptance:
    name: Verify and reuse complete matching platform acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged compilation and panel test inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 83fa23433112df3fdb4da9248286a4f41e4bb852
          git diff --exit-code 83fa23433112df3fdb4da9248286a4f41e4bb852 HEAD -- device vendor tests/panel_062_regressions.py
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/127596418013 --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42127815685
          name: aquora-065-platform-bundle
          path: ${{ runner.temp }}/platform
      - name: Verify exact accepted bytes
        run: |
          for target in native native-repro single-core host-panel; do
            (cd "$RUNNER_TEMP/platform/aquora-065-$target" && sha256sum --check --strict SHA256SUMS.txt)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aquora-065-platform-bundle
          path: ${{ runner.temp }}/platform/
          retention-days: 30

  browser-wasm-reuse:
    name: Verify and reuse matching successful WASM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged browser compilation inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 8aa8338c4304c3d0748680c0f7f879b4b7735af9
          git diff --exit-code 8aa8338c4304c3d0748680c0f7f879b4b7735af9 HEAD -- device
          test "$(git diff --name-only 8aa8338c4304c3d0748680c0f7f879b4b7735af9 HEAD -- vendor)" = vendor/fm1-base/device/aquora_async_store.h
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/127590393567 --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42126040098
          name: aquora-065-browser-wasm
          path: ${{ runner.temp }}/wasm
      - name: Verify exact inherited bytes
        run: cd "$RUNNER_TEMP/wasm" && sha256sum --check --strict SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aquora-065-browser-wasm
          path: ${{ runner.temp }}/wasm/
          retention-days: 30

  stage-release:
    name: Assemble matching firmware and browser installer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [host-regressions, platform-acceptance, browser-wasm-reuse]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aquora-065-platform-bundle
          path: ${{ runner.temp }}/platform
      - uses: actions/download-artifact@v4
        with:
          name: aquora-065-browser-wasm
          path: ${{ runner.temp }}/wasm
      - name: Stage and verify matching installer assets
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          source="$RUNNER_TEMP/source"
          native="$RUNNER_TEMP/platform/aquora-065-native"
          wasm="$RUNNER_TEMP/wasm"
          for input in "$native" "$RUNNER_TEMP/platform/aquora-065-native-repro" "$wasm"; do
            (cd "$input" && sha256sum --check --strict SHA256SUMS.txt)
          done
          cmp "$native/sound-healing-0.6.5.fwsc" "$RUNNER_TEMP/platform/aquora-065-native-repro/sound-healing-0.6.5.fwsc"
          mkdir -p "$out" "$source"
          cd evidence/0.6.0/editor
          sha256sum --check --strict SHA256SUMS.txt
          tar --no-same-owner -xzf AQUORA-0.6.0-editor-source.tar.gz -C "$source"
          cd "$GITHUB_WORKSPACE"
          git archive "$GITHUB_SHA" device tests vendor | tar -xf - -C "$source"
          git archive "$GITHUB_SHA" -- .github '*.md' research release validation | tar -xf - -C "$source"
          cd "$source"
          patch --batch --forward -p1 < vendor/patches/aquora-passive-air.patch
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$out/AQUORA-0.6.5-source.tar.gz" .
          mkdir -p device/build device/web
          cp -r "$wasm/emu" device/build/
          cp -r "$wasm/words" device/web/
          firmware="$native/sound-healing-0.6.5.fwsc"
          python3 vendor/fm1-base/tools/make_site.py device "$firmware" 0.6.5 "$RUNNER_TEMP/stage"
          stage="$RUNNER_TEMP/stage"
          grep -Fq '"product": "FM-1_73000605"' "$stage/install/index.html"
          cmp "$firmware" "$stage/firmware/sound-healing-0.6.5.fwsc"
          cmp "$wasm/emu/app.wasm" "$stage/emu/app.wasm"
          test -s "$stage/manual/index.html"
          python3 tests/direct_update_065.py "$firmware" | tee "$out/direct-update.log"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$out/AQUORA-0.6.5-package.tar.gz" -C "$stage" .
          cd "$out"
          sha256sum AQUORA-0.6.5-*.tar.gz > SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > validation-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aquora-065-release-ready
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
