name: AQUORA 0.6.0 isolated host validation

on:
  push:
    branches: [aquora-0.6.0-ci-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquora-0.6.0-ci-validation
  cancel-in-progress: false

jobs:
  host-regressions:
    name: Verify archives and sanitized host DSP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify versioned recovery archives
        run: |
          cd evidence/0.6.0/editor
          sha256sum --check SHA256SUMS.txt
      - name: Build and execute isolated DSP regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aquora-0.6.0-host-tests
          for test in patch_shape_060 groove_air_060 motif_memory_060 play_grid_060 arrangement_roles_060 next_acceptance dsp_acceptance stereo transport_hit; do
            gcc -Wall -Wextra -Werror -O1 -g -DSR_DEVICE -DPLAT_HOST \
              -Idevice/dsp -Ivendor/fm1-base/include \
              -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie \
              device/dsp/engine.c "tests/${test}.c" -lm \
              -o "/tmp/aquora-0.6.0-host-tests/${test}"
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
              "/tmp/aquora-0.6.0-host-tests/${test}" \
              > "/tmp/aquora-0.6.0-host-tests/${test}.log" 2>&1 || {
                cat "/tmp/aquora-0.6.0-host-tests/${test}.log"
                exit 1
              }
            echo "PASS ${test}"
          done
      - name: Upload compact test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquora-060-host-logs
          path: /tmp/aquora-0.6.0-host-tests/*.log
          if-no-files-found: ignore
          retention-days: 7
