name: Publish accepted AQUORA 0.6.4
on:
  push:
    branches: [aquora-0.6.4-development]
    paths: ['validation/publish-064.txt']
permissions:
  contents: write
  actions: read
concurrency:
  group: aquora-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check immutable accepted source and successful gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42087112438 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42087112438 --jq .head_sha)" = 50b8a1e02e215aff1e0a7b738d40f63769d4f502
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42087112438
          path: ${{ runner.temp }}/accepted
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42085609310
          path: ${{ runner.temp }}/original-platform
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42086488836
          name: aquora-064-host-logs
          path: ${{ runner.temp }}/accepted/previous-dsp-logs
      - name: Verify accepted artifact hashes and source record
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/accepted/aquora-064-host-logs" "$RUNNER_TEMP/accepted/final-dsp-migration-logs"
          cp -a "$RUNNER_TEMP/original-platform/"* "$RUNNER_TEMP/accepted/"
          cd "$RUNNER_TEMP/accepted"
          for folder in aquora-064-native aquora-064-native-repro aquora-064-browser-wasm aquora-064-single-core aquora-064-release-ready; do
            (cd "$folder" && sha256sum --check --strict SHA256SUMS.txt)
          done
          cmp aquora-064-native/sound-healing-0.6.4.fwsc aquora-064-native-repro/sound-healing-0.6.4.fwsc
          test "$(cat aquora-064-release-ready/validation-commit.txt)" = 50b8a1e02e215aff1e0a7b738d40f63769d4f502
      - name: Preserve checksummed independent download and publish accepted tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/final"
          mkdir "$out"
          accepted="$RUNNER_TEMP/accepted"
          cp "$accepted/aquora-064-release-ready/"* "$out/"
          cp "$accepted/aquora-064-native/sound-healing-0.6.4.fwsc" "$out/"
          cp "$accepted/aquora-064-single-core/sound-healing-0.6.4.fwsc" "$out/sound-healing-0.6.4-single-core.fwsc"
          cp release/0.6.4/RELEASE.md "$out/"
          (cd "$accepted" && zip -qr "$out/AQUORA-0.6.4-acceptance.zip" .)
          (cd "$out" && zip -q AQUORA-0.6.4-download.zip AQUORA-0.6.4-source.tar.gz AQUORA-0.6.4-package.tar.gz sound-healing-0.6.4.fwsc sound-healing-0.6.4-single-core.fwsc validation-commit.txt RELEASE.md)
          (cd "$out" && sha256sum *.gz *.zip *.fwsc > SHA256SUMS.txt && sha256sum --check --strict SHA256SUMS.txt)
          if gh release view v0.6.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing v0.6.4 release preserved; inspect before any replacement.'
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/aquora-0.6.4-development" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo 'Newer integration checkpoint exists; stale publisher stopped.'; exit 1; }
          gh release create v0.6.4 --repo "$GITHUB_REPOSITORY" --target "50b8a1e02e215aff1e0a7b738d40f63769d4f502" \
            --title 'AQUORA 0.6.4 — Generative Sound Sanctuary' \
            --notes-file release/0.6.4/RELEASE.md "$out/"*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquora-064-published-backup
          path: ${{ runner.temp }}/final/
          if-no-files-found: ignore
          retention-days: 30
