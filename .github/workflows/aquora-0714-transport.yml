name: AQUORA v0.7.14 transport fixture verification
on:
  push:
    branches: [aquora-v0.7.14-development]
    paths:
      - tests/transport_hit.c
      - device/dsp/**
      - .github/workflows/aquora-0714-transport.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aquora-0714-transport
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile latest engine and transport regression fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aquora-0714"
          cc -O2 -Idevice/dsp tests/transport_hit.c device/dsp/engine.c -lm -o "$RUNNER_TEMP/aquora-0714/transport_hit"
      - name: Execute complete transport regression suite
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aquora-0714/transport_hit" 2>&1 | tee "$RUNNER_TEMP/aquora-0714/transport.log"
      - name: Preserve test log and commit identity
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aquora-0714"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/aquora-0714/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquora-0714-transport
          path: ${{ runner.temp }}/aquora-0714/
          if-no-files-found: error
          retention-days: 30
