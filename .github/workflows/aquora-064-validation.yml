name: AQUORA 0.6.4 isolated host validation

on:
  push:
    branches: [aquora-0.6.4-development, aquora-0.6.4-release-integration]
    paths: ['validation/trigger-064.txt']
  workflow_dispatch:
  pull_request:
    branches: [aquora-0.6.4-development, aquora-0.6.4-release-integration]

permissions:
  contents: read
  actions: read

concurrency:
  group: aquora-0.6.4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regressions:
    name: Verify archives and sanitized host DSP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify versioned recovery archives
        run: |
          cd evidence/0.6.0/editor
          sha256sum --check SHA256SUMS.txt
      - name: Build and execute isolated DSP regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aquora-0.6.4-host-tests
          for test in next_acceptance dsp_acceptance stereo transport_hit corrective_061 air_status_062 binaural_062 binaural_stereo_062 air_mapping_062 music_modes_064; do
            gcc -Wall -Wextra -Werror -O1 -g -DSR_DEVICE -DPLAT_HOST \
              -Idevice/dsp -Ivendor/fm1-base/include \
              -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie \
              $(if [[ "$test" != binaural_062 ]]; then echo device/dsp/engine.c; fi) "tests/${test}.c" -lm \
              -o "/tmp/aquora-0.6.4-host-tests/${test}"
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
              "/tmp/aquora-0.6.4-host-tests/${test}" \
              > "/tmp/aquora-0.6.4-host-tests/${test}.log" 2>&1 || {
                cat "/tmp/aquora-0.6.4-host-tests/${test}.log"
                exit 1
              }
            echo "PASS ${test}"
          done
      - name: Verify archived serializer migration and four bank roundtrips
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/migration-base"
          mkdir -p "$base"
          tar -xzf evidence/0.6.0/editor/AQUORA-0.6.0-editor-source.tar.gz -C "$base"
          gcc -Wall -Wextra -Werror -Wno-unused-function -O1 -DSR_DEVICE -DPLAT_HOST -DLEGACY_FIXTURE \
            -DAQ_ARRANGEMENT="\"$base/device/arrangement.c\"" \
            -I"$base/device/dsp" -I"$base/vendor/fm1-base/include" \
            "$base/device/dsp/engine.c" tests/bank_migration_040.c -lm -o "$RUNNER_TEMP/bank-writer"
          "$RUNNER_TEMP/bank-writer" "$RUNNER_TEMP/bank.bin"
          gcc -Wall -Wextra -Werror -O1 -g -DSR_DEVICE -DPLAT_HOST \
            '-DAQ_ARRANGEMENT="../device/arrangement.c"' -Idevice/dsp -Ivendor/fm1-base/include \
            -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie \
            device/dsp/engine.c tests/bank_migration_040.c -lm -o "$RUNNER_TEMP/bank-reader"
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/bank-reader" "$RUNNER_TEMP/bank.bin" | tee /tmp/aquora-0.6.4-host-tests/bank-migration.log
      - name: Verify v063 migration and exact mode bank recall
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 0f2716ba0499def94884860248f9b0e887b0fd0d
          git show 0f2716ba0499def94884860248f9b0e887b0fd0d:device/arrangement.c > /tmp/arrangement063.c
          gcc -Wall -Wextra -Werror -Wno-unused-function -O1 -DSR_DEVICE -DPLAT_HOST -DLEGACY_FIXTURE '-DAQ_ARRANGEMENT="/tmp/arrangement063.c"' -Idevice/dsp -Ivendor/fm1-base/include device/dsp/engine.c tests/bank_064.c -lm -o /tmp/bank063-writer
          /tmp/bank063-writer /tmp/bank063.bin
          gcc -Wall -Wextra -Werror -Wno-unused-function -O1 -g -DSR_DEVICE -DPLAT_HOST -Idevice/dsp -Ivendor/fm1-base/include -fsanitize=address,undefined -no-pie device/dsp/engine.c tests/bank_064.c -lm -o /tmp/bank064-reader
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 /tmp/bank064-reader /tmp/bank063.bin | tee /tmp/aquora-0.6.4-host-tests/bank064.log
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42085609310
          name: aquora-064-host-panel
          path: ${{ runner.temp }}/field-after
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42022969585
          name: aquora-063-host-panel
          path: ${{ runner.temp }}/field-before
      - name: Preserve real before and after frame evidence
        run: |
          mkdir -p /tmp/aquora-0.6.4-host-tests/field-comparison
          cp "$RUNNER_TEMP/field-before/previews/polar-bloom/00.png" /tmp/aquora-0.6.4-host-tests/field-comparison/previous-secondary.png
          cp "$RUNNER_TEMP/field-before/previews/polar-bloom/preview.gif" /tmp/aquora-0.6.4-host-tests/field-comparison/previous-secondary.gif
          cp -r "$RUNNER_TEMP/field-after/captures064/resonance-b0" /tmp/aquora-0.6.4-host-tests/field-comparison/new-field
          printf '%s\n' 'Real accepted renderer frames: v063 run42022969585 vs v064 run42085609310. Different captures demonstrate the new nodal geometry; not a controlled acoustic experiment. Never publish standalone visualizers in website gallery.' > /tmp/aquora-0.6.4-host-tests/field-comparison/README.txt
      - name: Upload compact test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquora-064-host-logs
          path: /tmp/aquora-0.6.4-host-tests/
          if-no-files-found: ignore
          retention-days: 30

  platform-acceptance:
    name: Reuse five verified builds without recompilation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify identical firmware inputs and successful platform gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code 2eaea586cf06b3681b4b2d52378665d11c35b94e HEAD -- device vendor tests/capture_ui_064.py
          for id in 127449760450 127449760889 127449761132 127449761148 127449761152; do
            test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/$id --jq .conclusion)" = success
          done
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42085609310 --jq .head_sha)" = 2eaea586cf06b3681b4b2d52378665d11c35b94e
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42085609310
          path: ${{ runner.temp }}/accepted-platform
      - name: Verify every inherited platform artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/accepted-platform"
          for target in host-panel browser-wasm native native-repro single-core; do
            (cd "aquora-064-$target" && sha256sum --check --strict SHA256SUMS.txt)
          done
          cmp aquora-064-native/sound-healing-0.6.4.fwsc aquora-064-native-repro/sound-healing-0.6.4.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: aquora-064-platform-provenance
          path: ${{ runner.temp }}/accepted-platform/*/SHA256SUMS.txt

  stage-release:
    name: Assemble matching firmware and browser installer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [host-regressions, platform-acceptance]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42085609310
          name: aquora-064-native
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42085609310
          name: aquora-064-native-repro
          path: ${{ runner.temp }}/native-repro
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42085609310
          name: aquora-064-browser-wasm
          path: ${{ runner.temp }}/wasm
      - name: Stage and verify matching installer assets
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          source="$RUNNER_TEMP/source"
          native="$RUNNER_TEMP/native"
          wasm="$RUNNER_TEMP/wasm"
          for input in "$native" "$RUNNER_TEMP/native-repro" "$wasm"; do
            (cd "$input" && sha256sum --check --strict SHA256SUMS.txt)
          done
          cmp "$native/sound-healing-0.6.4.fwsc" "$RUNNER_TEMP/native-repro/sound-healing-0.6.4.fwsc"
          mkdir -p "$out" "$source"
          cd evidence/0.6.0/editor
          sha256sum --check --strict SHA256SUMS.txt
          tar --no-same-owner -xzf AQUORA-0.6.0-editor-source.tar.gz -C "$source"
          cd "$GITHUB_WORKSPACE"
          git archive "$GITHUB_SHA" device tests vendor | tar -xf - -C "$source"
          git archive "$GITHUB_SHA" -- .github '*.md' research release validation | tar -xf - -C "$source"
          cd "$source"
          patch --batch --forward -p1 < vendor/patches/aquora-passive-air.patch
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$out/AQUORA-0.6.4-source.tar.gz" .
          mkdir -p device/build device/web
          cp -r "$wasm/emu" device/build/
          cp -r "$wasm/words" device/web/
          firmware="$native/sound-healing-0.6.4.fwsc"
          python3 vendor/fm1-base/tools/make_site.py device "$firmware" 0.6.4 "$RUNNER_TEMP/stage"
          stage="$RUNNER_TEMP/stage"
          grep -Fq '"product": "FM-1_73000604"' "$stage/install/index.html"
          cmp "$firmware" "$stage/firmware/sound-healing-0.6.4.fwsc"
          cmp "$wasm/emu/app.wasm" "$stage/emu/app.wasm"
          test -s "$stage/manual/index.html"
          python3 tests/direct_update_064.py "$firmware" | tee "$out/direct-update.log"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$out/AQUORA-0.6.4-package.tar.gz" -C "$stage" .
          cd "$out"
          sha256sum AQUORA-0.6.4-*.tar.gz > SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > validation-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aquora-064-release-ready
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
