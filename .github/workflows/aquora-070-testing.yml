name: AQUORA 0.7.0 next build testing gates
on:
  push:
    branches: [aquora-0.7.0-development]
    paths: ['.github/workflows/aquora-070-testing.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: aquora-070-testing
  cancel-in-progress: false
jobs:
  testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Recover source; reuse passed composition and graphics; verify persistence delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/CodingSlapfu/AQUORA/actions/runs/42689236446 > "$RUNNER_TEMP/prior.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["conclusion"]=="success" and d["head_sha"]=="6991ec0cde40cf1b6e905d1ba3e5c04f24fc2f2f"' "$RUNNER_TEMP/prior.json"
          bash tools/prepare_next_source.sh "$RUNNER_TEMP/source"
          mkdir "$RUNNER_TEMP/results"
          cp "$RUNNER_TEMP/prior.json" "$RUNNER_TEMP/results/reused-composition-graphics-CI.json"
          cd "$RUNNER_TEMP/source"
          python3 -m pip install Pillow==11.3.0
          python3 vendor/fm1-base/tools/build.py device --host --release 0.7.0
          mkdir "$RUNNER_TEMP/results/preferences"
          AQUORA_TEST_AUTOSTART=0 device/build/host/sound-healing_host tests/preferences_070.txt "$RUNNER_TEMP/results/preferences" | tee "$RUNNER_TEMP/results/preferences.log"
      - name: Restore verified compiler
        run: |
          set -euo pipefail
          curl --fail --location --max-time 180 -o "$RUNNER_TEMP/jieli.tar.xz" https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz
          echo "a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd  $RUNNER_TEMP/jieli.tar.xz" | sha256sum -c --strict
          mkdir "$RUNNER_TEMP/jieli"
          tar --no-same-owner -xf "$RUNNER_TEMP/jieli.tar.xz" -C "$RUNNER_TEMP/jieli"
          echo "JIELI_TOOLCHAIN=$RUNNER_TEMP/jieli/jieli-linux-toolchains-20260730.1" >> "$GITHUB_ENV"
      - name: Native, reproducible native, single-core, updater
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          export AC79_SDK="$PWD/vendor/ac79-package-files"
          for kind in native native-repro single-core; do
            mkdir "$RUNNER_TEMP/results/$kind"
            if [ "$kind" = single-core ]; then export FM1B_CPU2=0; else unset FM1B_CPU2; fi
            python3 vendor/fm1-base/tools/build.py device --release 0.7.0 2>&1 | tee "$RUNNER_TEMP/results/$kind/build.log"
            cp device/build/*.fwsc device/build/*.elf "$RUNNER_TEMP/results/$kind/"
            rm -rf device/build
          done
          cmp "$RUNNER_TEMP/results/native/sound-healing-0.7.0.fwsc" "$RUNNER_TEMP/results/native-repro/sound-healing-0.7.0.fwsc"
          python3 tests/direct_update_070.py "$RUNNER_TEMP/results/native/sound-healing-0.7.0.fwsc" | tee "$RUNNER_TEMP/results/updater.log"
      - name: Current WASM
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 3.1.64
          ./emsdk activate 3.1.64
          source ./emsdk_env.sh
          unset FM1B_CPU2
          cd "$RUNNER_TEMP/source"
          python3 vendor/fm1-base/tools/build.py device --web --release 0.7.0 2>&1 | tee "$RUNNER_TEMP/results/wasm.log"
          node -e 'new WebAssembly.Module(require("fs").readFileSync(process.argv[1]))' device/build/emu/app.wasm
          cp -r device/build/emu "$RUNNER_TEMP/results/emu"
          python3 vendor/fm1-base/tools/make_site.py device "$RUNNER_TEMP/results/native/sound-healing-0.7.0.fwsc" 0.7.0 "$RUNNER_TEMP/results/testing-installer"
          python3 tools/stage_testing_070.py "$RUNNER_TEMP/results/testing-installer"
          node tests/installer_hash_070.mjs "$RUNNER_TEMP/results/testing-installer/install/index.html" "$RUNNER_TEMP/results/native/sound-healing-0.7.0.fwsc" | tee "$RUNNER_TEMP/results/installer-hash.log"
      - name: Package without audio recordings
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/results/native/sound-healing-0.7.0.fwsc" "$RUNNER_TEMP/results/AQUORA-0.7.0-next-build-testing.fwsc"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/results/source-commit.txt"
          printf '%s\n' 'NEXT BUILD TESTING ONLY; 0.7.0 / FM-1_73000700. Original Puya 0x856014 FM-1 only. Physical listening, flash, RF, LCD and DMA/XRUN acceptance pending. Public 0.6.10 and musical candidate unchanged.' > "$RUNNER_TEMP/results/README.txt"
          tar --exclude=.git --exclude=release --exclude=archive --exclude=evidence --exclude='*.zip' --exclude='*.tar.gz' --exclude='*.tar.xz' --exclude=audio --exclude=recordings --exclude='*.ogg' --exclude='*.wav' --exclude='*.mp3' --exclude='*/build/*' -czf "$RUNNER_TEMP/results/AQUORA-0.7.0-source.tar.gz" -C "$RUNNER_TEMP/source" .
          cd "$RUNNER_TEMP/results"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          zip -qr "$RUNNER_TEMP/AQUORA-0.7.0-testing.zip" .
          cp "$RUNNER_TEMP/AQUORA-0.7.0-testing.zip" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AQUORA-0.7.0-next-build-testing
          path: ${{ runner.temp }}/results/
          retention-days: 90
