name: Publish accepted AQUORA 0.6.7
on:
  push:
    branches: [aquora-next-integration]
    paths: ['validation/publish-067.txt']
permissions:
  contents: write
  actions: read
concurrency:
  group: aquora-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete software and matching platform source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42412774240 --jq .conclusion)" = success
          git fetch --no-tags --depth=1 origin 17c2e3d539cd606ec96806511f835c1e2567b39b
          git diff --exit-code 17c2e3d539cd606ec96806511f835c1e2567b39b HEAD -- device vendor
          python3 tests/requirement_gate_next.py --release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42412774240
          name: aquora-067-platform
          path: ${{ runner.temp }}/accepted
      - name: Preserve exact accepted firmware and live installer
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/accepted" && sha256sum -c --strict SHA256SUMS.txt)
          cmp "$RUNNER_TEMP/accepted/native/sound-healing-0.6.7.fwsc" "$RUNNER_TEMP/accepted/native-repro/sound-healing-0.6.7.fwsc"
          mkdir "$RUNNER_TEMP/final" "$RUNNER_TEMP/site"
          echo '87c829adf3fddbdb7eb2de586166dbecc8ba4f90b3b15b6adb89368b697cca8a  release/0.6.7/AQUORA-0.6.7-installer.tar.gz' | sha256sum -c --strict
          tar -xzf release/0.6.7/AQUORA-0.6.7-installer.tar.gz -C "$RUNNER_TEMP/site"
          (cd "$RUNNER_TEMP/site" && sha256sum -c --strict SITE-SHA256SUMS.txt)
          cmp "$RUNNER_TEMP/site/firmware/sound-healing-0.6.7.fwsc" "$RUNNER_TEMP/accepted/native/sound-healing-0.6.7.fwsc"
          cmp "$RUNNER_TEMP/site/emu/app.wasm" "$RUNNER_TEMP/accepted/emu/app.wasm"
          cp "$RUNNER_TEMP/accepted/native/sound-healing-0.6.7.fwsc" "$RUNNER_TEMP/final/"
          cp "$RUNNER_TEMP/accepted/single-core/sound-healing-0.6.7.fwsc" "$RUNNER_TEMP/final/sound-healing-0.6.7-single-core.fwsc"
          cp release/0.6.7/RELEASE.md validation/release-067/SOFTWARE_ACCEPTANCE.json "$RUNNER_TEMP/final/"
          cp release/0.6.7/AQUORA-0.6.7-installer.tar.gz "$RUNNER_TEMP/final/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/final/source-commit.txt"
      - name: Preserve full source and reproducible audio review artifacts
        run: |
          set -euo pipefail
          bash tools/prepare_next_source.sh "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          out="$RUNNER_TEMP/final"
          mkdir "$RUNNER_TEMP/audio" "$RUNNER_TEMP/stems"
          gcc -O2 -DSR_DEVICE -DPLAT_HOST -Idevice/dsp -Ivendor/fm1-base/include device/dsp/engine.c tests/audio_067.c -lm -o "$RUNNER_TEMP/render-audio"
          "$RUNNER_TEMP/render-audio" "$RUNNER_TEMP/audio" > "$RUNNER_TEMP/audio/RENDER.log"
          gcc -O2 -DSR_DEVICE -DPLAT_HOST -Idevice/dsp -Ivendor/fm1-base/include device/dsp/engine.c tests/role_stems_067.c -lm -o "$RUNNER_TEMP/render-stems"
          "$RUNNER_TEMP/render-stems" "$RUNNER_TEMP/stems" > "$RUNNER_TEMP/stems/RENDER.log"
          python3 tools/package_audio_067.py "$RUNNER_TEMP/audio" "$RUNNER_TEMP/stems" "$out/AQUORA-0.6.7-audio-review.zip"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --exclude=./device/build --exclude=./device/web -czf "$out/AQUORA-0.6.7-source.tar.gz" .
          (cd "$GITHUB_WORKSPACE" && zip -qr "$out/AQUORA-0.6.7-acceptance.zip" validation/release-067 tests/*067* .github/workflows/aquora-067* NEXT_RESUME.md NEXT_BUILD_ACTIVE.md)
          cd "$out"
          sha256sum *.fwsc *.gz *.zip > PAYLOAD-SHA256SUMS.txt
          zip -q AQUORA-0.6.7-download.zip *.fwsc *.gz AQUORA-0.6.7-acceptance.zip AQUORA-0.6.7-audio-review.zip RELEASE.md SOFTWARE_ACCEPTANCE.json source-commit.txt PAYLOAD-SHA256SUMS.txt
          sha256sum *.fwsc *.gz *.zip > SHA256SUMS.txt
          sha256sum -c --strict SHA256SUMS.txt
      - name: Publish new version while preserving prior releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.6.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing 0.6.7 preserved; inspect before retrying'; exit 1; fi
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/aquora-next-integration --jq .object.sha)" = "$GITHUB_SHA"
          gh release create v0.6.7 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'AQUORA 0.6.7 — Generative Sound Sanctuary' --notes-file release/0.6.7/RELEASE.md "$RUNNER_TEMP/final/"*
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: mirror
      - name: Publish exact installer mirror without erasing history
        run: |
          cp -a "$RUNNER_TEMP/site/." mirror/
          cd mirror
          git config user.name CodingSlapfu
          git config user.email 141080780+CodingSlapfu@users.noreply.github.com
          git add -A
          git commit -m 'Publish exact accepted AQUORA 0.6.7 installer mirror'
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquora-067-published-backup
          path: ${{ runner.temp }}/final/
          retention-days: 90
