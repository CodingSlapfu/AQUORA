name: AQUORA v0.7.14 host performance and vocal audio
on:
  push:
    branches: [aquora-v0.7.14-development]
    paths: [.github/workflows/aquora-0714-performance.yml]
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify audible recorded vocals and independent FX
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          for test in recorded_vocals_0711 vocal_fx_0714; do
            cc -O2 "tests/$test.c" -lm -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test" 2>&1 | tee "$RUNNER_TEMP/results/$test.log"
          done
      - name: Exercise all three visualizers under audio worker pressure
        run: |
          set -euo pipefail
          bash tools/prepare_next_source.sh "$RUNNER_TEMP/source"
          python3 -m pip install Pillow==11.3.0
          cd "$RUNNER_TEMP/source"
          python3 vendor/fm1-base/tools/build.py device --host --release 0.7.14 2>&1 | tee "$RUNNER_TEMP/results/host.log"
          python3 tests/latency_075.py "$PWD/device/build/host/sound-healing_host" "$RUNNER_TEMP/results/latency"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquora-0714-performance
          path: ${{ runner.temp }}/results/
          retention-days: 30
