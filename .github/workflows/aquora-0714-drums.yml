name: AQUORA v0.7.14 drum kit audio and transport validation
on:
  push:
    branches: [aquora-v0.7.14-development]
    paths:
      - device/dsp/**
      - tests/drum_kits_0714.c
      - .github/workflows/aquora-0714-drums.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aquora-0714-drums
  cancel-in-progress: false
jobs:
  drum-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build host drum-PCM and transport tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aquora"
          for test in drum_kits_0714 transport_hit release_controls_0714; do
            cc -O2 -Idevice/dsp "tests/$test.c" device/dsp/engine.c -lm -o "$RUNNER_TEMP/aquora/$test"
          done
      - name: Audio differentiation and regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in drum_kits_0714 transport_hit release_controls_0714; do
            "$RUNNER_TEMP/aquora/$test" 2>&1 | tee "$RUNNER_TEMP/aquora/$test.log"
          done
      - name: Record exact commit
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aquora"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/aquora/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquora-0714-drum-validation
          path: ${{ runner.temp }}/aquora/
          retention-days: 30
          if-no-files-found: error
