name: AQUORA 0.6.1 isolated host validation

on:
  push:
    branches: [aquora-0.6.1-corrective]
  workflow_dispatch:
  pull_request:
    branches: [aquora-0.6.1-corrective]

permissions:
  contents: read

concurrency:
  group: aquora-0.6.1-corrective
  cancel-in-progress: false

jobs:
  host-regressions:
    name: Verify archives and sanitized host DSP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify versioned recovery archives
        run: |
          cd evidence/0.6.0/editor
          sha256sum --check SHA256SUMS.txt
      - name: Build and execute isolated DSP regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aquora-0.6.1-host-tests
          for test in patch_shape_060 groove_air_060 motif_memory_060 play_grid_060 arrangement_roles_060 next_acceptance dsp_acceptance stereo transport_hit; do
            gcc -Wall -Wextra -Werror -O1 -g -DSR_DEVICE -DPLAT_HOST \
              -Idevice/dsp -Ivendor/fm1-base/include \
              -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie \
              device/dsp/engine.c "tests/${test}.c" -lm \
              -o "/tmp/aquora-0.6.1-host-tests/${test}"
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
              "/tmp/aquora-0.6.1-host-tests/${test}" \
              > "/tmp/aquora-0.6.1-host-tests/${test}.log" 2>&1 || {
                cat "/tmp/aquora-0.6.1-host-tests/${test}.log"
                exit 1
              }
            echo "PASS ${test}"
          done
      - name: Upload compact test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquora-061-host-logs
          path: /tmp/aquora-0.6.1-host-tests/*.log
          if-no-files-found: ignore
          retention-days: 30

  platform-acceptance:
    name: ${{ matrix.target }} acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [host-panel, browser-wasm, native, single-core]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore verified source and pinned vendor inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/results"
          cd evidence/0.6.0/editor
          sha256sum --check --strict SHA256SUMS.txt
          tar --no-same-owner -xzf AQUORA-0.6.0-editor-source.tar.gz -C "$RUNNER_TEMP/source"
          cd "$GITHUB_WORKSPACE"
          git archive "$GITHUB_SHA" device tests vendor | tar -xf - -C "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          patch --batch --forward -p1 < vendor/patches/aquora-passive-air.patch
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install Emscripten 3.1.64
        if: matrix.target == 'browser-wasm'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 3.1.64
          ./emsdk activate 3.1.64
      - name: Restore checksummed JieLi 20260730.1
        if: matrix.target == 'native' || matrix.target == 'single-core'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 --retry 2 -o "$RUNNER_TEMP/jieli.tar.xz" https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz
          printf '%s  %s\n' a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd "$RUNNER_TEMP/jieli.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/jieli"
          tar --no-same-owner -xf "$RUNNER_TEMP/jieli.tar.xz" -C "$RUNNER_TEMP/jieli"
          mapfile -t compilers < <(find "$RUNNER_TEMP/jieli" -type d -name pi32v2)
          test "${#compilers[@]}" -eq 1
          toolchain="$(dirname "${compilers[0]}")"
          test -d "$toolchain/common"
          printf 'JIELI_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
      - name: Build and test selected target
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          out="$RUNNER_TEMP/results"
          build=(python3 vendor/fm1-base/tools/build.py device --release 0.6.1)
          case "$TARGET" in
            host-panel)
              "${build[@]}" --host 2>&1 | tee "$out/build.log"
              for test in controls_060 fullscreen_060 mixer_unified_060 patch_shape_060 play_panel_060 reachability_060; do
                mkdir "$out/$test"
                device/build/host/sound-healing_host "tests/$test.txt" "$out/$test" 2>&1 | tee "$out/$test.log"
              done
              gcc -O2 -DSR_DEVICE -DPLAT_HOST -Idevice/dsp -Ivendor/fm1-base/include device/dsp/engine.c tests/benchmark.c -lm -o "$RUNNER_TEMP/benchmark"
              "$RUNNER_TEMP/benchmark" | tee "$out/host-timing.log"
              ;;
            browser-wasm)
              source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
              "${build[@]}" --web 2>&1 | tee "$out/build.log"
              node -e 'const fs = require("node:fs"); new WebAssembly.Module(fs.readFileSync(process.argv[1]));' device/build/emu/app.wasm
              cp -r device/build/emu device/web/words "$out/"
              ;;
            native|single-core)
              if [[ "$TARGET" == single-core ]]; then export FM1B_CPU2=0; fi
              "${build[@]}" --sdk vendor/ac79-package-files 2>&1 | tee "$out/build.log"
              grep -Fq 'identity FM-1_73000601' "$out/build.log"
              firmware=device/build/sound-healing-0.6.1.fwsc
              node vendor/fm1-base/tests/installer_ports_test.mjs "$firmware" | tee "$out/installer.log"
              cp "$firmware" "$out/"
              ;;
          esac
          (
            cd "$out"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
      - name: Preserve logs and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquora-061-${{ matrix.target }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
          retention-days: 30

  stage-release:
    name: Assemble matching firmware and browser installer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [host-regressions, platform-acceptance]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aquora-061-native
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@v4
        with:
          name: aquora-061-browser-wasm
          path: ${{ runner.temp }}/wasm
      - name: Stage and verify matching installer assets
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          source="$RUNNER_TEMP/source"
          native="$RUNNER_TEMP/native"
          wasm="$RUNNER_TEMP/wasm"
          for input in "$native" "$wasm"; do
            (cd "$input" && sha256sum --check --strict SHA256SUMS.txt)
          done
          mkdir -p "$out" "$source"
          cd evidence/0.6.0/editor
          sha256sum --check --strict SHA256SUMS.txt
          tar --no-same-owner -xzf AQUORA-0.6.0-editor-source.tar.gz -C "$source"
          cd "$GITHUB_WORKSPACE"
          git archive "$GITHUB_SHA" device tests vendor | tar -xf - -C "$source"
          git archive "$GITHUB_SHA" -- .github '*.md' research | tar -xf - -C "$source"
          cd "$source"
          patch --batch --forward -p1 < vendor/patches/aquora-passive-air.patch
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$out/AQUORA-0.6.1-source.tar.gz" .
          mkdir -p device/build device/web
          cp -r "$wasm/emu" device/build/
          cp -r "$wasm/words" device/web/
          firmware="$native/sound-healing-0.6.1.fwsc"
          python3 vendor/fm1-base/tools/make_site.py device "$firmware" 0.6.1 "$RUNNER_TEMP/stage"
          stage="$RUNNER_TEMP/stage"
          grep -Fq '"product": "FM-1_73000601"' "$stage/install/index.html"
          cmp "$firmware" "$stage/firmware/sound-healing-0.6.1.fwsc"
          cmp "$wasm/emu/app.wasm" "$stage/emu/app.wasm"
          test -s "$stage/manual/index.html"
          sed -e 's/FM-1_7010300/FM-1_73000600/g' -e 's/FM-1_7010400/FM-1_73000601/g' \
            vendor/fm1-base/tests/installer_ports_test.mjs > vendor/fm1-base/tests/aquora_direct_update.mjs
          node vendor/fm1-base/tests/aquora_direct_update.mjs "$firmware" | tee "$out/direct-update.log"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "$out/AQUORA-0.6.1-package.tar.gz" -C "$stage" .
          cd "$out"
          sha256sum AQUORA-0.6.1-*.tar.gz > SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > validation-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aquora-061-release-ready
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
