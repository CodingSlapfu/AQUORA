name: AQUORA public showcase
on:
  push:
    branches: [aquora-showcase-site]
    paths: ['site/**', '.github/workflows/aquora-showcase-pages.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: aquora-public-showcase-publisher
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construct public site from published, accepted v0.6.2 assets
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist"
          rel="$RUNNER_TEMP/aquora-062"
          screens="$RUNNER_TEMP/aquora-panels"
          mkdir -p "$out/emu" "$out/studio" "$out/assets" "$rel" "$screens"
          gh release download v0.6.2 -R "$GITHUB_REPOSITORY" -p AQUORA-0.6.2-package.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/AQUORA-0.6.2-package.tar.gz" -C "$rel"
          test -s "$rel/emu/app.wasm"
          test -s "$rel/emu/worklet.js"
          cp -a "$rel/emu/." "$out/emu/"
          python3 site/tools/patch_emu.py "$out/emu/index.html"
          cp site/index.html site/style.css "$out/"
          cp site/studio/index.html "$out/studio/"
          cp site/assets/favicon.svg "$out/assets/"
          gh run download 41998659763 -R "$GITHUB_REPOSITORY" -n aquora-062-host-panel -D "$screens"
          cp "$screens/panel-062/polar-fullscreen.png" "$out/assets/polar-062.png"
          cp "$screens/panel-062/original-normal.png" "$out/assets/play-062.png"
          cp "$screens/previews/original/00.png" "$out/assets/original-062.png"
          cp "$screens/appearance-matrix/t1-f2-b0/sound.png" "$out/assets/sound-062.png"
          cp "$screens/appearance-matrix/t1-f2-b0/evolve.png" "$out/assets/evolve-062.png"
          cp "$screens/appearance-matrix/t1-f2-b0/mix.png" "$out/assets/mixer-062.png"
          cp "$screens/appearance-matrix/t1-f2-b0/mix-strip.png" "$out/assets/mix-strip-062.png"
          cp "$screens/appearance-matrix/t1-f2-b0/drums.png" "$out/assets/drums-062.png"
          cp "$screens/appearance-matrix/t1-f2-b0/air-fx.png" "$out/assets/air-062.png"
          cp "$screens/appearance-matrix/t2-f2-b1/setup.png" "$out/assets/appearance-062.png"
          touch "$out/.nojekyll"
          cat > "$out/PROVENANCE.txt" <<'EOF'
          AQUORA v0.6.2 website sourced from accepted release.
          Firmware commit b6d452202bb12c955c29f1726fea5a02bcc91e61
          CI run https://github.com/CodingSlapfu/AQUORA/actions/runs/41998659763
          Ten actual v0.6.2 software-rendered captures (nine gallery, one PLAY hero).
          Published WASM byte-for-byte unchanged; Studio adapter affects HTML only.
          EOF
          echo "d9bd8745bed889ee34106febdda5b07ce16db1977c88b0bf0212369837dbb2c2  $out/emu/app.wasm" | sha256sum --check --strict
          node -e 'const f=require("fs");new WebAssembly.Module(f.readFileSync("dist/emu/app.wasm"));console.log("WASM valid")'
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import struct
          d=Path("dist")
          assert "AQUORA Studio companion bridge" in (d/"emu/index.html").read_text()
          assert "AQUORA_STUDIO" in (d/"studio/index.html").read_text()
          for name in ("play","polar","original","sound","evolve","mixer","mix-strip","drums","air","appearance"):
              raw=(d/"assets"/(name+"-062.png")).read_bytes()
              assert raw[:8]==b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II",raw[16:24])==(240,240)
          class P(HTMLParser): pass
          for f in (d/"index.html",d/"studio/index.html",d/"emu/index.html"):
              P().feed(f.read_text())
          import re
          forbidden=re.compile(r"(?i)M-VAVE|HYP-1|ChoralRoot|Sony|Sega|0\.6\.1")
          for file in d.rglob("*"):
              if file.is_file() and file.suffix in (".html",".css",".js",".svg",".txt"):
                  assert forbidden.search(file.read_text(encoding="utf-8")) is None, file
          expected={name+"-062.png" for name in ("play","polar","original","sound","evolve","mixer","mix-strip","drums","air","appearance")}
          assert {file.name for file in (d/"assets").glob("*.png")} == expected
          assert all(name in (d/"index.html").read_text() for name in expected)
          print("Verified 10 current 0.6.2 captures including PLAY hero and public text")
          PY
          (cd "$out"; find . -type f ! -name SITE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SITE-SHA256SUMS.txt)
      - name: Archive matching public-site build
        uses: actions/upload-artifact@v4
        with:
          name: aquora-site-stable-062
          path: dist/
          include-hidden-files: true
          retention-days: 90
      - name: Push verified static site to the separate public gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site-publication"
          cd "$RUNNER_TEMP/site-publication"
          git init -q
          git config user.name "aquora-site-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git checkout -b gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "site: AQUORA v0.6.2 playable showcase and studio"
            git push origin HEAD:gh-pages
          fi
      - name: Report branch publication and external Pages deployment
        if: always()
        run: |
          echo "Generated site branch: https://github.com/$GITHUB_REPOSITORY/tree/gh-pages"
          echo "GitHub Pages is configured for branch publishing (gh-pages / root). The native Pages deployment is handled separately."
          echo "The Pages service tracks gh-pages independently; verify its native pages build and public browser behavior before claiming complete browser acceptance."
