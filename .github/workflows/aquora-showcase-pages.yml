name: AQUORA public showcase
on:
  push:
    branches: [aquora-showcase-site]
    paths: ['site/**', '.github/workflows/aquora-showcase-pages.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: aquora-public-showcase-publisher
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construct public site from published, accepted v0.6.1 assets
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist"
          rel="$RUNNER_TEMP/aquora-061"
          screens="$RUNNER_TEMP/aquora-panels"
          mkdir -p "$out/emu" "$out/studio" "$out/assets" "$rel" "$screens"
          gh release download v0.6.1 -R "$GITHUB_REPOSITORY" -p AQUORA-0.6.1-package.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/AQUORA-0.6.1-package.tar.gz" -C "$rel"
          test -s "$rel/emu/app.wasm"
          test -s "$rel/emu/worklet.js"
          cp -a "$rel/emu/." "$out/emu/"
          python3 site/tools/patch_emu.py "$out/emu/index.html"
          cp site/index.html site/style.css "$out/"
          cp site/studio/index.html "$out/studio/"
          cp site/assets/favicon.svg "$out/assets/"
          gh run download 41969916116 -R "$GITHUB_REPOSITORY" -n aquora-061-host-panel -D "$screens"
          cp "$screens/corrective_061/polar-bloom-fullscreen.png" "$out/assets/polar.png"
          cp "$screens/corrective_061/original-fullscreen.png" "$out/assets/original.png"
          cp "$screens/corrective_061/sound-live.png" "$out/assets/sound.png"
          cp "$screens/corrective_061/evolve-live.png" "$out/assets/evolve.png"
          cp "$screens/mixer_unified_060/unified.png" "$out/assets/mixer.png"
          cp "$screens/corrective_061/startup.png" "$out/assets/intro.png"
          touch "$out/.nojekyll"
          cat > "$out/PROVENANCE.txt" <<'EOF'
          AQUORA public site — pinned accepted v0.6.1
          Source commit: 23c8db04538fec13171a6e380501bb153f949311
          Authentic WebAssembly emulator from published v0.6.1 package.
          Original bridge sends hardware input events, not direct DSP writes.
          Actual firmware screenshots from successful CI run 41969916116.
          The mixer image is a 0.6.x test capture; redesign is in progress.
          v0.6.2 is an independent unfinished development candidate, not embedded.
          EOF
          node -e 'const f=require("fs");new WebAssembly.Module(f.readFileSync("dist/emu/app.wasm"));console.log("WASM valid")'
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import struct
          d=Path("dist")
          assert "AQUORA Studio companion bridge" in (d/"emu/index.html").read_text()
          assert "AQUORA_STUDIO" in (d/"studio/index.html").read_text()
          for name in ("polar","original","sound","evolve","mixer","intro"):
              raw=(d/"assets"/(name+".png")).read_bytes()
              assert raw[:8]==b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II",raw[16:24])==(240,240)
          class P(HTMLParser): pass
          for f in (d/"index.html",d/"studio/index.html",d/"emu/index.html"):
              P().feed(f.read_text())
          print("Authentic 240x240 captures and site HTML verified")
          PY
          (cd "$out"; find . -type f ! -name SITE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SITE-SHA256SUMS.txt)
      - name: Archive matching public-site build
        uses: actions/upload-artifact@v4
        with:
          name: aquora-site-stable-061
          path: dist/
          include-hidden-files: true
          retention-days: 90
      - name: Push verified static site to the separate public gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site-publication"
          cd "$RUNNER_TEMP/site-publication"
          git init -q
          git config user.name "aquora-site-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git checkout -b gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "site: AQUORA v0.6.1 playable showcase and studio"
            git push origin HEAD:gh-pages
          fi
      - name: Configure GitHub Pages when already enabled
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Deploy Pages
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Explain first-time Pages activation
        if: always()
        run: |
          echo "Generated site branch: https://github.com/$GITHUB_REPOSITORY/tree/gh-pages"
          echo "If Pages was not configured, select Settings > Pages > Deploy from a branch > gh-pages / (root)."
          echo "Do not claim the website is live until the public site actually loads."
