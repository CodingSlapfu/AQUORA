name: AQUORA v0.7.16 verified asset backup
on:
  push:
    branches: [aquora-vocal-controls]
    paths: [.github/workflows/aquora-0716-backup.yml]
permissions:
  actions: read
  contents: write
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5094d60d54204248e2a80f54aa678cbcf4d0285b
      - uses: actions/download-artifact@v4
        with:
          name: aquora-0716-native-validation
          github-token: ${{ github.token }}
          run-id: 44009953623
          path: ${{ runner.temp }}/native
      - name: Back up the verified FWSC on a dedicated Git branch
        env:
          SOURCE: 5094d60d54204248e2a80f54aa678cbcf4d0285b
          SHA256: d1deb8f59aac35770b363f7ad29688c7044d20f691542a2b57db285612031b97
          BACKUP_BRANCH: aquora-v0.7.16-testing-backup
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/native/source-commit.txt")" = "$SOURCE"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git fetch origin "refs/heads/$BACKUP_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          path=validation/release-0716/assets
          mkdir -p "$path"
          cp "$RUNNER_TEMP/native/sound-healing-0.7.16.fwsc" "$path/AQUORA-0.7.16.fwsc"
          printf '%s  AQUORA-0.7.16.fwsc\n' "$SHA256" > "$path/SHA256SUMS"
          (cd "$path" && sha256sum --check --strict SHA256SUMS)
          git config user.name 'AQUORA GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'Back up verified AQUORA FM-1_73000716 candidate'
          git push origin "HEAD:refs/heads/$BACKUP_BRANCH"
          git fetch origin "refs/heads/$BACKUP_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git cat-file blob "FETCH_HEAD:$path/AQUORA-0.7.16.fwsc" | sha256sum
