name: Publish isolated AQUORA 0.7.0 testing installer
on:
  push:
    branches: [aquora-070-release-delivery]
    paths: ['.github/workflows/aquora-070-hosting.yml']
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: aquora-070-testing-hosting
  cancel-in-progress: false
jobs:
  hosting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve existing verified installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/CodingSlapfu/AQUORA/actions/artifacts/13707509647/zip > artifact.zip
          echo '44fa3f0471befce7335cb98e8eaa30b8d0995e1a25c5396858712e72fce5f228  artifact.zip' | sha256sum -c --strict
          unzip -q artifact.zip -d passed
          python3 tools/prepare_070_delivery_hosting.py
      - name: Preserve any existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/CodingSlapfu/AQUORA/pages > existing-pages.json 2> pages-read-error.txt; then
            echo 'Existing GitHub Pages configuration found. Preserving it; separate hosting required.'
            cat existing-pages.json
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AQUORA-0.7.0-testing-hosting-evidence
          path: |
            _site
            existing-pages.json
            pages-read-error.txt
          retention-days: 90
