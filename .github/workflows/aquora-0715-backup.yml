name: AQUORA v0.7.15 verified asset backup
on:
  push:
    branches: [aquora-vocal-controls]
    paths: [.github/workflows/aquora-0715-backup.yml]
permissions:
  actions: read
  contents: write
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ef3f3e44a42309f472033e0aa249d610ac9301c
      - uses: actions/download-artifact@v4
        with:
          name: aquora-0715-native-validation
          github-token: ${{ github.token }}
          run-id: 44008105555
          path: ${{ runner.temp }}/native
      - name: Back up the verified FWSC on a dedicated Git branch
        env:
          SOURCE: 6ef3f3e44a42309f472033e0aa249d610ac9301c
          SHA256: 04fef2404bd75f1085ea8538d61f98fddc85a24dee98afa8319abcca28756615
          BACKUP_BRANCH: aquora-v0.7.15-testing-backup
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/native/source-commit.txt")" = "$SOURCE"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git fetch origin "refs/heads/$BACKUP_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          path=validation/release-0715/assets
          mkdir -p "$path"
          cp "$RUNNER_TEMP/native/sound-healing-0.7.15.fwsc" "$path/AQUORA-0.7.15.fwsc"
          printf '%s  AQUORA-0.7.15.fwsc\n' "$SHA256" > "$path/SHA256SUMS"
          (cd "$path" && sha256sum --check --strict SHA256SUMS)
          git config user.name 'AQUORA GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'Back up verified AQUORA FM-1_73000715 candidate'
          git push origin "HEAD:refs/heads/$BACKUP_BRANCH"
          git fetch origin "refs/heads/$BACKUP_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git cat-file blob "FETCH_HEAD:$path/AQUORA-0.7.15.fwsc" | sha256sum
