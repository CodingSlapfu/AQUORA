name: AQUORA v0.7.14 staged installer verification
on:
  push:
    branches: [aquora-v0.7.14-development]
    paths: [.github/workflows/aquora-0714-installer.yml]
permissions:
  actions: read
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: aquora-0714-native-validation
          github-token: ${{ github.token }}
          run-id: 43981203002
          path: native
      - name: Verify native provenance and prepare source
        run: |
          set -euo pipefail
          test "$(cat native/source-commit.txt)" = "2fc5b3cbd3ad337bd9712667a3f403249d495365"
          git diff --exit-code "2fc5b3cbd3ad337bd9712667a3f403249d495365" HEAD -- device vendor tools
          (cd native && sha256sum -c --strict SHA256SUMS)
          bash tools/prepare_next_source.sh "$RUNNER_TEMP/source"
          python3 -m pip install Pillow==11.3.0
      - name: Compile matching browser firmware and stage installer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 3.1.64
          ./emsdk activate 3.1.64
          source ./emsdk_env.sh
          cd "$RUNNER_TEMP/source"
          python3 vendor/fm1-base/tools/build.py device --web --release 0.7.14 2>&1 | tee "$RUNNER_TEMP/results/wasm.log"
          node -e 'new WebAssembly.Module(require("fs").readFileSync(process.argv[1]))' device/build/emu/app.wasm
          python3 vendor/fm1-base/tools/make_site.py device "$GITHUB_WORKSPACE/native/sound-healing-0.7.14.fwsc" 0.7.14 "$RUNNER_TEMP/results/installer"
          python3 - "$RUNNER_TEMP/results/installer/install/index.html" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          html = p.read_text()
          match = re.search(r'const meta = (\{.*?\});', html)
          assert match
          meta = json.loads(match[1])
          assert meta['product'] == 'FM-1_73000714' and meta['version'] == '0.7.14'
          firmware = p.parent / meta['pkg']
          from os import environ
          verified = Path(environ['GITHUB_WORKSPACE']) / 'native/sound-healing-0.7.14.fwsc'
          assert firmware.read_bytes() == verified.read_bytes()
          meta['sha256'] = hashlib.sha256(firmware.read_bytes()).hexdigest()
          html = html[:match.start(1)] + json.dumps(meta) + html[match.end(1):]
          hook = '    if (productOf(pkg) !== meta.product)'
          assert html.count(hook) == 1
          assert html.count('let writing = false;') == 1
          html = html.replace('let writing = false;', '''async function candidateHashOk(raw) {
            const hash = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", raw)), b => b.toString(16).padStart(2, "0")).join("");
            return hash === meta.sha256;
          }
          let writing = false;''')
          html = html.replace(hook, '    if (!await candidateHashOk(pkg)) { sayK("badpkg"); return; }\n' + hook)
          p.write_text(html)
          print('Verified staged SHA-256', meta['sha256'])
          PY
          node tests/installer_hash_070.mjs "$RUNNER_TEMP/results/installer/install/index.html" "$GITHUB_WORKSPACE/native/sound-healing-0.7.14.fwsc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquora-0714-staged-installer
          path: ${{ runner.temp }}/results/
          retention-days: 30
