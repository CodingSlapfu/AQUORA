name: Publish accepted AQUORA 0.6.5
on:
  push:
    branches: [aquora-0.6.5-development]
    paths: ['validation/publish-065.txt']
permissions:
  contents: write
  actions: read
concurrency:
  group: aquora-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check immutable accepted source and successful gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42128145960 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/42128145960 --jq .head_sha)" = 45c02ebb17e93684092227b16378277bbe3841d3
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42128145960
          path: ${{ runner.temp }}/accepted
      - name: Verify accepted artifact hashes and source record
        run: |
          set -euo pipefail
          for target in native native-repro single-core host-panel; do
            cp -a "$RUNNER_TEMP/accepted/aquora-065-platform-bundle/aquora-065-$target" "$RUNNER_TEMP/accepted/"
          done
          rm -rf "$RUNNER_TEMP/accepted/aquora-065-platform-bundle"
          cd "$RUNNER_TEMP/accepted"
          for folder in aquora-065-native aquora-065-native-repro aquora-065-browser-wasm aquora-065-single-core aquora-065-release-ready; do
            (cd "$folder" && sha256sum --check --strict SHA256SUMS.txt)
          done
          cmp aquora-065-native/sound-healing-0.6.5.fwsc aquora-065-native-repro/sound-healing-0.6.5.fwsc
          test "$(cat aquora-065-release-ready/validation-commit.txt)" = 45c02ebb17e93684092227b16378277bbe3841d3
      - name: Preserve checksummed independent download and publish accepted tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/final"
          mkdir "$out"
          accepted="$RUNNER_TEMP/accepted"
          cp "$accepted/aquora-065-release-ready/"* "$out/"
          cp "$accepted/aquora-065-native/sound-healing-0.6.5.fwsc" "$out/"
          cp "$accepted/aquora-065-single-core/sound-healing-0.6.5.fwsc" "$out/sound-healing-0.6.5-single-core.fwsc"
          cp release/0.6.5/RELEASE.md "$out/"
          (cd "$accepted" && zip -qr "$out/AQUORA-0.6.5-acceptance.zip" .)
          (cd "$out" && zip -q AQUORA-0.6.5-download.zip AQUORA-0.6.5-source.tar.gz AQUORA-0.6.5-package.tar.gz sound-healing-0.6.5.fwsc sound-healing-0.6.5-single-core.fwsc validation-commit.txt RELEASE.md)
          (cd "$out" && sha256sum *.gz *.zip *.fwsc > SHA256SUMS.txt && sha256sum --check --strict SHA256SUMS.txt)
          if gh release view v0.6.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing v0.6.5 release preserved; inspect before any replacement.'
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/aquora-0.6.5-development" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo 'Newer integration checkpoint exists; stale publisher stopped.'; exit 1; }
          gh release create v0.6.5 --repo "$GITHUB_REPOSITORY" --target "45c02ebb17e93684092227b16378277bbe3841d3" \
            --title 'AQUORA 0.6.5 — Generative Sound Sanctuary' \
            --notes-file release/0.6.5/RELEASE.md "$out/"*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquora-065-published-backup
          path: ${{ runner.temp }}/final/
          if-no-files-found: ignore
          retention-days: 30
